name: Build Gadget

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ZIP and VGadget
        shell: bash
        run: |
          set -euo pipefail

          GADGET_NAME="Wrapped_Tapered_Spiral_Surfacing_Toolpath"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          rm -rf dist
          mkdir -p "dist/${GADGET_NAME}"

          cp -R "${GADGET_NAME}/." "dist/${GADGET_NAME}/"

          cd dist
          zip -r "${GADGET_NAME}_${VERSION}.zip" "${GADGET_NAME}"
          cp "${GADGET_NAME}_${VERSION}.zip" "${GADGET_NAME}_${VERSION}.vgadget"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gadget-files
          path: |
            dist/*.zip
            dist/*.vgadget

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.vgadget \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated gadget release for ${GITHUB_REF_NAME}"
